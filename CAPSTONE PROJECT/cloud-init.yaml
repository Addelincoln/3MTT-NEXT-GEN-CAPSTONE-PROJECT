#cloud-config
package_update: true
package_upgrade: true

packages:
  - apache2
  - php
  - libapache2-mod-php
  - php-mysql
  - mysql-server
  - unzip
  - git

write_files:
  - path: /var/www/html/index.php
    permissions: "0644"
    content: |
      <?php
      // Placeholder page shown when app_repo_url is not set.
      // Replace by pointing app_repo_url at your LAMP app's git repository.
      echo "<h1>SME App - Deployed on Azure</h1>";
      echo "<p>Server time: " . date("Y-m-d H:i:s") . "</p>";
      $conn = @mysqli_connect("localhost", "smeapp", "changeme", "smeapp_db");
      echo $conn ? "<p>Database connection: OK</p>" : "<p>Database connection: not configured yet</p>";
      ?>

runcmd:
  # Basic MySQL hardening + app database/user
  - mysql -e "CREATE DATABASE IF NOT EXISTS smeapp_db;"
  - mysql -e "CREATE USER IF NOT EXISTS 'smeapp'@'localhost' IDENTIFIED BY 'changeme';"
  - mysql -e "GRANT ALL PRIVILEGES ON smeapp_db.* TO 'smeapp'@'localhost'; FLUSH PRIVILEGES;"
  # Enable Apache rewrite (most PHP apps need it) and restart services
  - a2enmod rewrite
  - systemctl enable apache2
  - systemctl restart apache2
  - systemctl enable mysql
  - systemctl restart mysql
  # Optional: pull the real app if a repo URL was supplied via Terraform templating
  - |
    if [ -n "${app_repo_url}" ]; then
      rm -rf /var/www/html/*
      git clone "${app_repo_url}" /var/www/html
      chown -R www-data:www-data /var/www/html
    fi
  - chown -R www-data:www-data /var/www/html

final_message: "LAMP stack ready after $UPTIME seconds"
